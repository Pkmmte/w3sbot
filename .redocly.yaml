theme:
  colors:
    primary:
      main: '#36AF57' # Medium Sea Green - W3Schools primary brand color
    text:
      primary: '#555555' # Davy's Grey
      secondary: '#3A3A3A' # Black Olive
    success:
      main: '#36AF57' # Medium Sea Green
    warning:
      main: '#FFA500'
    error:
      main: '#D41F1C'
    http:
      get: '#36AF57' # Medium Sea Green for GET
      post: '#186FAF'
      put: '#95507C'
      patch: '#BF581D'
      delete: '#CC3333'
      basic: '#707070'
      link: '#07818F'
      head: '#A23DAD'
  typography:
    fontSize: '14px'
    fontFamily: 'Arial, sans-serif'
    headings:
      fontFamily: 'Arial, sans-serif'
      fontWeight: 'bold'
    code:
      fontSize: '13px'
      fontFamily: 'Courier, monospace'
      lineHeight: '20px'
      fontWeight: '400'
      backgroundColor: '#F1F1F1' # Anti-Flash White
      color: '#3A3A3A' # Black Olive
      wrap: false
  sidebar:
    backgroundColor: '#F1F1F1' # Anti-Flash White
    textColor: '#555555' # Davy's Grey
    activeTextColor: '#36AF57' # Medium Sea Green
    groupItems:
      activeBackgroundColor: '#CCCCCC' # Chinese Silver
      activeTextColor: '#3A3A3A' # Black Olive
  rightPanel:
    backgroundColor: '#F1F1F1' # Anti-Flash White
    textColor: '#3A3A3A' # Black Olive

